{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2>Admin Login</h2>
  <form method="post">
    <label>Username
      <input name="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
